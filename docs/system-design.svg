<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #111; }
    .box { fill: #fff; stroke: #111; stroke-width: 2; rx: 14; }
    .title { font-size: 24px; font-weight: 700; }
    .label { font-size: 18px; }
    .small { font-size: 16px; }
    .arrow { stroke: #111; stroke-width: 2.5; marker-end: url(#a); }
  </style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#111"/></marker></defs>
  <text x="600" y="42" text-anchor="middle" class="title">LearnForge AI Support — RAG System Design</text>
  <rect x="50" y="90" width="180" height="70" class="box"/><text x="140" y="132" text-anchor="middle" class="label">User / Streamlit</text>
  <rect x="290" y="90" width="190" height="70" class="box"/><text x="385" y="122" text-anchor="middle" class="label">Conversation</text><text x="385" y="146" text-anchor="middle" class="small">context</text>
  <rect x="540" y="90" width="190" height="70" class="box"/><text x="635" y="122" text-anchor="middle" class="label">Query builder</text><text x="635" y="146" text-anchor="middle" class="small">multi-turn rewrite</text>
  <rect x="790" y="90" width="190" height="70" class="box"/><text x="885" y="122" text-anchor="middle" class="label">Embedding</text><text x="885" y="146" text-anchor="middle" class="small">MiniLM</text>
  <rect x="520" y="240" width="230" height="80" class="box"/><text x="635" y="273" text-anchor="middle" class="label">Hybrid retrieval</text><text x="635" y="299" text-anchor="middle" class="small">FAISS + lexical overlap</text>
  <rect x="830" y="240" width="250" height="80" class="box"/><text x="955" y="273" text-anchor="middle" class="label">Metadata re-rank</text><text x="955" y="299" text-anchor="middle" class="small">authority + freshness</text>
  <rect x="505" y="390" width="260" height="90" class="box"/><text x="635" y="425" text-anchor="middle" class="label">Confidence / risk gate</text><text x="635" y="451" text-anchor="middle" class="small">clarify • answer • escalate</text>
  <rect x="120" y="545" width="250" height="80" class="box"/><text x="245" y="578" text-anchor="middle" class="label">Clarifying question</text><text x="245" y="602" text-anchor="middle" class="small">ambiguous requests</text>
  <rect x="475" y="545" width="250" height="80" class="box"/><text x="600" y="578" text-anchor="middle" class="label">Grounded generation</text><text x="600" y="602" text-anchor="middle" class="small">Groq / safe fallback</text>
  <rect x="830" y="545" width="250" height="80" class="box"/><text x="955" y="578" text-anchor="middle" class="label">Human escalation</text><text x="955" y="602" text-anchor="middle" class="small">weak/conflicting evidence</text>
  <rect x="50" y="240" width="300" height="80" class="box"/><text x="200" y="272" text-anchor="middle" class="label">Knowledge base</text><text x="200" y="298" text-anchor="middle" class="small">15 FAQs • 10 policies • 15 tickets</text>
  <line x1="230" y1="125" x2="290" y2="125" class="arrow"/><line x1="480" y1="125" x2="540" y2="125" class="arrow"/><line x1="730" y1="125" x2="790" y2="125" class="arrow"/>
  <line x1="885" y1="160" x2="700" y2="240" class="arrow"/><line x1="350" y1="280" x2="520" y2="280" class="arrow"/><line x1="750" y1="280" x2="830" y2="280" class="arrow"/>
  <line x1="955" y1="320" x2="700" y2="390" class="arrow"/><line x1="585" y1="480" x2="300" y2="545" class="arrow"/><line x1="635" y1="480" x2="600" y2="545" class="arrow"/><line x1="690" y1="480" x2="900" y2="545" class="arrow"/>
</svg>